channels:
  - conda-forge
  - nodefaults
dependencies:
  - ipykernel
  # Dependencies for VS Code IDE
  - code-server>=3.2
  - jupyter-vscode-proxy
  - openssh
  - rio-tiler
  - pre_commit
  # Upgrade from pangeo-notebook image
  - earthaccess>=0.16.0
  # Pin down to avoid https://github.com/holoviz/pyviz_comms/issues/143
  - pyviz_comms==3.0.4
  - pip
  - pip:
    # Install via pip to avoid conda datafusion/libabseil solver conflicts with py3.12.
    - arbalister
    - jupyter-sshd-proxy
    - jupyterlab-bxplorer
    - git+https://github.com/MAAP-Project/jupyter-server-extension.git@v3.0.0
    - git+https://github.com/MAAP-Project/maap-py.git@v5.1.0a2
    # - maap-edsc-jupyter-extension==1.1.1
    - maap-help-jupyter-extension==2.0.2
    - maap-libs-jupyter-extension==1.2.5
    - git+https://github.com/MAAP-Project/user-workspace-management-jupyter-extension.git@develop
    - git+https://github.com/jsignell/dps-jupyter-extension.git@patch-1
    - git+https://github.com/jsignell/algorithms-jupyter-extension.git@patch-1

variables:
  TITILER_STAC_ENDPOINT: 'https://openveda.cloud/api/stac'
  TITILER_ENDPOINT: 'https://openveda.cloud/api/raster'
  STAC_CATALOG_NAME: 'VEDA STAC'
  STAC_CATALOG_URL: 'https://openveda.cloud/api/stac'
  STAC_BROWSER_URL: 'https://openveda.cloud/'
